name: 自动更新优选IP

on:
  schedule:
    - cron: '0 */6 * * *'   # 每6小时更新一次（UTC时间）
  workflow_dispatch:        # 允许手动点击运行

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 运行更新脚本
        run: python update_ips.py

      - name: 提交并推送更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add best_ips_grouped_full.txt
          git diff --staged --quiet || git commit -m "自动更新优选IP $(date +'%Y-%m-%d %H:%M')"
          git push
